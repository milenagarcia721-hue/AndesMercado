name: CI - Calidad de ventas

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      dataset:
        description: CSV que se desea validar
        required: true
        default: ventas.csv
        type: choice
        options:
          - ventas.csv
          - ventas_anexo.csv

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pruebas automatizadas
        run: pytest -v

      - name: Validar archivo de ventas
        shell: bash
        run: |
          DATASET="${{ inputs.dataset || 'ventas.csv' }}"
          python validar_ventas.py "$DATASET"
